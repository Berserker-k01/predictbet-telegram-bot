services:
  bot:
    build: .
    container_name: predictbet-bot
    restart: unless-stopped
    env_file: .env
    ports:
      - "8788:8788"
    volumes:
      - ./data:/app/data
    environment:
      ADMIN_PORT: "8788"
      SESSION_FILE: "./data/sessions.json"
      ADMIN_STORE_FILE: "./data/admin.json"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
